        function base64ToUint8Array(base64) {
            var binary_string = window.atob(base64);
            var len = binary_string.length;
            var bytes = new Uint8Array(len);
            for (var i = 0; i < len; i++) {
                bytes[i] = binary_string.charCodeAt(i);
            }
            return bytes;
        }
        
        const threatData = base64ToUint8Array(threats[0]);
        for(let i = 0; i < threatData.length; i++) {
            let val = threatData[i] / 255.0;
            // Color mapping: South(Green) -> Mid(Yellow) -> North(Red/Black)
            let r = 0, g = 0, b = 0;
            if (val < 0.25) { r = 40; g = 100 + val*400; b = 40; } // Greenish
            else if (val < 0.6) { r = 100 + (val-0.25)*400; g = 180 - (val-0.25)*200; b = 40; } // Yellowish
            else if (val < 0.85) { r = 200 + (val-0.6)*200; g = 100 - (val-0.6)*400; b = 40; } // Reddish
            else { r = 255 - (val-0.85)*1000; g = 40 - (val-0.85)*200; b = 40; } // Dark red/grey
            
            let idx = i * 4;
            imgData.data[idx] = r;
            imgData.data[idx+1] = g;
            imgData.data[idx+2] = b;
            imgData.data[idx+3] = 255; // Alpha
        }
        ctx.putImageData(imgData, 0, 0);
