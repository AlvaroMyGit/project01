name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore project01.sln

      - name: Build (warnings as errors)
        run: dotnet build project01.sln --configuration Release --no-restore -warnaserror

      # Rebuilds the test project so coverlet.msbuild can instrument it, then
      # fails the job if total line coverage drops below the floor. Raise the
      # Threshold as coverage grows (ratchet).
      - name: Test (with coverage gate)
        run: >
          dotnet test tests/StalkerALifeSandbox.Tests/StalkerALifeSandbox.Tests.csproj
          --configuration Release
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./TestResults
          /p:CollectCoverage=true
          /p:CoverletOutputFormat=cobertura
          /p:CoverletOutput=./TestResults/coverage.cobertura.xml
          /p:Threshold=26
          /p:ThresholdType=line
          /p:ThresholdStat=total

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults
          if-no-files-found: ignore
